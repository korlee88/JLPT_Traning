<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JLPT N4 학습 트래커</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%9A%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="style.css?v=dev" />
</head>
<body>
  <header class="topbar">
    <h1>JLPT N4 학습 트래커</h1>
    <p id="dday" class="dday"></p>
    <!-- What to do *today*, not just this week. Lives in the topbar so it is on
         screen from every tab, which is the whole point of asking for it. -->
    <p id="today-task" class="today-task" hidden></p>
  </header>

  <!-- Two tabs. 오늘 체크 and 전체 계획 were removed on 2026-10-17: four days of
       use and the owner called them "쓸대없는 모니터". What they were for — the
       day's task and the D-day — is in the topbar above, on every screen. -->
  <nav class="tabs">
    <button class="tab-btn active" data-tab="quiz">쪽지시험</button>
    <button class="tab-btn" data-tab="radical">한자 기초</button>
  </nav>

  <main>
    <section id="tab-quiz" class="tab-panel active">
      <div class="card">
        <h2>쪽지시험</h2>
        <div id="quiz-start">
          <p>무작위로 출제됩니다. 모든 쪽지시험 5문제.</p>
          <div class="quiz-buttons">
            <button id="start-hiragana" class="btn quiz-type-btn" data-type="hiragana">히라가나 쪽지시험</button>
            <button id="start-katakana" class="btn quiz-type-btn" data-type="katakana">가타카나 쪽지시험</button>
            <button id="start-loanword" class="btn quiz-type-btn" data-type="loanword">외래어 쪽지시험</button>
            <button id="start-vocab" class="btn quiz-type-btn" data-type="vocab">단어 쪽지시험</button>
            <button id="start-kanji" class="btn quiz-type-btn" data-type="kanji">한자 쪽지시험</button>
            <button id="start-grammar" class="btn quiz-type-btn" data-type="grammar">문법 쪽지시험</button>
            <button id="start-reading" class="btn quiz-type-btn" data-type="reading">독해 쪽지시험</button>
            <button id="start-listening" class="btn quiz-type-btn" data-type="listening">청해 쪽지시험</button>
          </div>
          <!-- The review schedule, visible. Ids keep the "wrong-" prefix from
               when this was a wrong/not-wrong queue; renaming them would churn
               the CSS and tests for nothing. -->
          <section id="wrong-note" class="wrong-note">
            <h3>복습 노트 <span id="wrong-total" class="wrong-total"></span></h3>
            <p id="wrong-progress" class="wrong-progress" hidden></p>
            <p id="wrong-empty" class="wrong-empty" hidden>오늘 복습할 것이 없습니다. 쪽지시험을 풀면 복습 일정이 쌓이고, 맞힐 때마다 다음 복습이 멀어집니다.</p>
            <div id="wrong-groups"></div>
          </section>
        </div>
        <div id="quiz-play" hidden>
          <p id="quiz-progress"></p>
          <p id="quiz-prompt" class="quiz-prompt" lang="ja"></p>
          <p id="quiz-reveal" class="quiz-reveal" hidden lang="ja"></p>
          <p id="quiz-meaning" class="quiz-meaning" hidden lang="ja"></p>
          <div id="quiz-replays" class="quiz-replays" hidden>
            <button id="quiz-replay" class="btn replay-btn">🔊 다시 듣기</button>
            <button id="quiz-replay-slow" class="btn replay-btn">🐢 천천히</button>
          </div>
          <p id="quiz-hint" class="quiz-hint"></p>
          <!-- 독해 only: the question in Korean, under the Japanese one. -->
          <p id="quiz-hint-ko" class="quiz-hint-ko" hidden></p>
          <div id="quiz-choices" class="quiz-choices" lang="ja"></div>
          <button id="quiz-say" class="btn" hidden>🔊 발음 듣기</button>
          <p id="quiz-note" class="quiz-note" hidden lang="ja"></p>
          <button id="quiz-next" class="btn" hidden>다음</button>
        </div>
        <div id="quiz-result" hidden>
          <p id="quiz-score"></p>
          <button id="quiz-retry" class="btn">쪽지시험 목록으로</button>
        </div>
      </div>
    </section>

    <section id="tab-radical" class="tab-panel">
      <div class="card">
        <h2>부수로 묶어 보기</h2>
        <p class="radical-intro">한자는 뜻을 나르는 부품(부수)과 소리를 나르는 부품으로 이루어집니다. 글자마다 무엇으로 짜였는지 적어 뒀으니, 모양을 뜯어 보면서 외우세요. 글자를 누르면 그 글자가 쓰인 단어가 나옵니다.</p>
        <button id="radical-mask" class="btn">🙈 뜻 가리고 외우기</button>
      </div>
      <div id="radical-groups"></div>
    </section>
  </main>

  <!-- The deploy workflow rewrites every "dev" marker to the commit SHA, so a
       phone holding a stale app.js is pulled forward as soon as index.html
       revalidates, and this line says which build is actually running. -->
  <footer class="buildstamp">build dev</footer>

  <script src="app.js?v=dev"></script>
</body>
</html>
